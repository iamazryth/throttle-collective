<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Throttle Collective</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

  <div class="max-w-2xl mx-auto p-8">
    <h1 class="text-4xl font-bold mb-8 flex items-center gap-3">
      <i class="fa-solid fa-lock"></i> Admin Panel
    </h1>

    <!-- Add Ride Form -->
    <form id="ride-form" onsubmit="addRide(event)" class="bg-zinc-900 p-8 rounded-3xl border border-zinc-700">
      <!-- Same form fields as before -->
      <div class="grid grid-cols-2 gap-6">
        <div class="col-span-2">
          <label class="block text-sm mb-2">Ride Title</label>
          <input id="title" type="text" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div>
          <label class="block text-sm mb-2">Date</label>
          <input id="date" type="date" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div>
          <label class="block text-sm mb-2">Time</label>
          <input id="time" type="time" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2">Location</label>
          <input id="location" type="text" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2">Google Maps Link</label>
          <input id="maps-link" type="url" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2">Description</label>
          <textarea id="description" rows="5" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4"></textarea>
        </div>
      </div>

      <div class="mt-8 flex gap-4">
        <button type="button" onclick="window.location.href='index.html'" 
                class="flex-1 py-4 border border-zinc-700 rounded-2xl">Cancel</button>
        <button type="submit" class="flex-1 py-4 bg-orange-600 hover:bg-orange-700 rounded-2xl font-semibold">
          Publish Ride
        </button>
      </div>
    </form>

    <h3 class="mt-12 mb-4 text-lg">Existing Rides</h3>
    <div id="admin-rides-list" class="space-y-3"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
