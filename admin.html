<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Throttle Collective</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
    .logo-font { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

  <div class="max-w-2xl mx-auto p-8 pt-12">
    <div class="flex items-center justify-between mb-10">
      <h1 class="text-4xl font-bold flex items-center gap-3">
        <i class="fa-solid fa-lock"></i> Admin Panel
      </h1>
      <a href="index.html" class="text-orange-500 hover:underline flex items-center gap-2">
        ← Back to Rides
      </a>
    </div>

    <!-- Add New Ride -->
    <form id="ride-form" onsubmit="addRide(event)" class="bg-zinc-900 p-8 rounded-3xl border border-zinc-700 mb-12">
      <div class="grid grid-cols-2 gap-6">
        <div class="col-span-2">
          <label class="block text-sm mb-2 text-zinc-400">Ride Title</label>
          <input id="title" type="text" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div>
          <label class="block text-sm mb-2 text-zinc-400">Date</label>
          <input id="date" type="date" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div>
          <label class="block text-sm mb-2 text-zinc-400">Time</label>
          <input id="time" type="time" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2 text-zinc-400">Location</label>
          <input id="location" type="text" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2 text-zinc-400">Google Maps Link</label>
          <input id="maps-link" type="url" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-5 py-4">
        </div>
        <div class="col-span-2">
          <label class="block text-sm mb-2 text-zinc-400">Description</label>
          <textarea id="description" rows="5" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4"></textarea>
        </div>
      </div>

      <div class="mt-8 flex gap-4">
        <button type="button" onclick="window.location.href='index.html'" 
                class="flex-1 py-4 border border-zinc-700 rounded-2xl">Cancel</button>
        <button type="submit" class="flex-1 py-4 bg-orange-600 hover:bg-orange-700 rounded-2xl font-semibold">
          Publish Ride
        </button>
      </div>
    </form>

    <!-- Remove Rides Section -->
    <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-700">
      <h3 class="text-xl font-semibold mb-6 flex items-center gap-2">
        <i class="fa-solid fa-trash-can"></i> Manage Rides
      </h3>
      <div id="admin-rides-list" class="space-y-4"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
