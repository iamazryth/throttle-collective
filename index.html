<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Throttle Collective • Motorbike Rides</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-black border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-motorcycle text-3xl text-orange-500"></i>
        <h1 class="logo-font text-3xl font-bold tracking-tighter">THROTTLE</h1>
      </div>
      <div class="flex items-center gap-8 text-sm uppercase tracking-widest">
        <a href="index.html" class="hover:text-orange-500">Rides</a>
        <a href="#" onclick="showAbout()" class="hover:text-orange-500">About</a>
        <button onclick="goToAdmin()" 
                class="bg-orange-600 hover:bg-orange-700 px-5 py-2 rounded-lg font-medium flex items-center gap-2">
          <i class="fa-solid fa-lock"></i> ADMIN
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-12">
    <div class="hero-bg h-96 rounded-3xl flex items-center justify-center text-center mb-12">
      <div>
        <h2 class="text-5xl font-bold mb-4 tracking-tighter">Ride Together.<br>Burn Rubber.</h2>
        <p class="text-xl text-zinc-400">Exclusive motorbike rides for the Throttle Collective</p>
      </div>
    </div>

    <div class="flex justify-between items-end mb-8">
      <h2 class="text-4xl font-semibold tracking-tight">Upcoming Rides</h2>
      <div class="text-sm text-zinc-500" id="ride-count"></div>
    </div>

    <div id="rides-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Populated by JS -->
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
